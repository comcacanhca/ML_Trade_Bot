name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check tests pipelines

      - name: Tests
        env:
          PYTHONPATH: research/rf_mlflow:vendor/scj
        run: |
          pytest -q

      - name: DVC sanity
        run: |
          dvc doctor
          dvc status --no-commit || true
