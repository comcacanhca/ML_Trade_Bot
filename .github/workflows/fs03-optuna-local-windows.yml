name: fs03-optuna-local-windows
on:
  push:
    branches: [main, master]

    paths:
      - "pipelines/_optuna/**"
      - "research/rf_mlflow/reproduce_fs03_fixed_params.py"
      - "research/rf_mlflow/train_rf_mlflow.py"
      - "research/rf_mlflow/mophong_adapter.py"
      - "research/rf_mlflow/plots.py"
      - "research/config.py"
      - "research/features.py"
      - "research/labels.py"
      - "research/data_io.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fs03-optuna-local-windows.yml"
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Optuna trials for CI run"
        required: true
        default: "3"
      max_train_rows:
        description: "Limit training rows for fast local CI; empty = full dataset"
        required: false
        default: "50000"
      skip_simulate:
        description: "Skip MoPhong simulation for fast CI"
        required: true
        type: boolean
        default: true
      enable_mlflow:
        description: "Log this CI run to local MLflow sqlite"
        required: true
        type: boolean
        default: false

concurrency:
  group: fs03-optuna-local-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optuna-pipeline:
    name: FS03 LightGBM Optuna pipeline on local Windows runner
    runs-on: [self-hosted, windows-latest]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: research;research/rf_mlflow;vendor/scj
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: mlruns
      OPTUNA_N_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.n_trials || '3' }}
      OPTUNA_MAX_TRAIN_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_train_rows || '50000' }}
      OPTUNA_SKIP_SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_simulate || true }}
      OPTUNA_ENABLE_MLFLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_mlflow || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate system Python 3.11
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = "C:\Program Files\Python311\python.exe"
          $pythonDir = "C:\Program Files\Python311"
          $scriptsDir = Join-Path $pythonDir "Scripts"

          try {
            $pythonItem = Get-Item -LiteralPath $pythonExe -ErrorAction Stop
          } catch {
            whoami
            Write-Host "Python expected at: $pythonExe"
            Write-Host "Access or installation check failed: $($_.Exception.Message)"
            throw "Python 3.11 was not found or is not accessible at C:\Program Files\Python311. Install Python 3.11 for all users and grant the runner account read/execute permission."
          }

          if (-not $pythonItem.PSIsContainer -and -not $pythonItem.Exists) {
            throw "Python executable does not exist: $pythonExe"
          }

          $version = (& $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($version -ne "3.11") {
            throw "Python is not version 3.11: $version ($pythonExe)"
          }

          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "PYTHON_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path -LiteralPath $scriptsDir -ErrorAction SilentlyContinue) {
            $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "Python executable: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version
      - name: Ensure Python 3.11 is installed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonExe = "C:\Program Files\Python311\python.exe"
          $pythonDir = "C:\Program Files\Python311"
          $scriptsDir = Join-Path $pythonDir "Scripts"

          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
            Write-Host "Python 3.11 not found at $pythonExe. Installing..."
            $installerUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe"
            $installerPath = Join-Path $env:TEMP "python311-amd64.exe"

            if (Get-Command winget -ErrorAction SilentlyContinue) {
              & winget install --id Python.Python.3.11 --exact --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
            } else {
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
              Start-Process -FilePath $installerPath -ArgumentList @(
                '/quiet',
                'InstallAllUsers=1',
                'PrependPath=1',
                'Include_test=0',
                'SimpleInstall=1'
              ) -Wait -NoNewWindow
            }

            if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) {
              throw "Python 3.11 installation failed."
            }
          }

          $version = (& $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ($version -ne "3.11") {
            throw "Python is not version 3.11: $version"
          }

          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path -LiteralPath $scriptsDir -ErrorAction SilentlyContinue) {
            $scriptsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "Python installed: $pythonExe"
          & $pythonExe --version
      - name: Show runner and Python environment
        shell: powershell
        run: |
          Write-Host "=== Operating system ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          Write-Host "=== Runner identity ==="
          whoami
          Write-Host "=== Python environment ==="
          & $env:PYTHON_EXE -c "import sys, platform; print('Executable:', sys.executable); print('Version:', sys.version); print('Platform:', platform.platform())"
          & $env:PYTHON_EXE -m pip --version
          Write-Host "=== Runner context ==="
          Get-Location
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Trials: $env:OPTUNA_N_TRIALS"
          Write-Host "Max train rows: $env:OPTUNA_MAX_TRAIN_ROWS"
          Write-Host "Skip simulate: $env:OPTUNA_SKIP_SIMULATE"
          Write-Host "Enable MLflow: $env:OPTUNA_ENABLE_MLFLOW"

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      - name: Static syntax check
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath "pipelines/_optuna" -Filter "*.py" | ForEach-Object { $_.FullName }
          & $env:PYTHON_EXE -m py_compile @files

      - name: Lint Optuna pipeline
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m ruff check pipelines/_optuna

      - name: CLI smoke tests
        shell: powershell
        run: |
          & $env:PYTHON_EXE pipelines/_optuna/data_processing.py --help
          & $env:PYTHON_EXE pipelines/_optuna/train_optuna_fs03.py --help
          & $env:PYTHON_EXE pipelines/_optuna/evaluate_fs03.py --help
          & $env:PYTHON_EXE pipelines/_optuna/run_fs03_optuna_pipeline.py --help

      - name: Build DVC feature store
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m dvc repro fs03_feature_store
          & $env:PYTHON_EXE -m dvc status --no-commit

      - name: Run FS03 Optuna CI pipeline
        shell: powershell
        run: |
          $argsList = @("pipelines/_optuna/run_fs03_optuna_pipeline.py", "--n-trials", "$env:OPTUNA_N_TRIALS")
          if ($env:OPTUNA_MAX_TRAIN_ROWS -and $env:OPTUNA_MAX_TRAIN_ROWS.Trim() -ne "") {
            $argsList += @("--max-train-rows", "$env:OPTUNA_MAX_TRAIN_ROWS")
          }
          if ($env:OPTUNA_SKIP_SIMULATE -match "^(true|True)$") { $argsList += "--skip-simulate" }
          if ($env:OPTUNA_ENABLE_MLFLOW -match "^(true|True)$") { $argsList += "--enable-mlflow" }
          & $env:PYTHON_EXE @argsList

      - name: Upload Optuna CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs03-optuna-local-windows-${{ github.run_number }}
          path: |
            outputs/pipelines_optuna/**
            models/*fs03_optuna_lgbm*_bundle.joblib
          if-no-files-found: warn
          retention-days: 14
