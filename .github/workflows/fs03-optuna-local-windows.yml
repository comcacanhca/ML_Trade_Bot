name: fs03-optuna-local-windows
on:
  push:
    branches: [main, master]

    paths:
      - "pipelines/_optuna/**"
      - "research/rf_mlflow/reproduce_fs03_fixed_params.py"
      - "research/rf_mlflow/train_rf_mlflow.py"
      - "research/rf_mlflow/mophong_adapter.py"
      - "research/rf_mlflow/plots.py"
      - "research/config.py"
      - "research/features.py"
      - "research/labels.py"
      - "research/data_io.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/fs03-optuna-local-windows.yml"
  workflow_dispatch:
    inputs:
      n_trials:
        description: "Optuna trials for CI run"
        required: true
        default: "3"
      max_train_rows:
        description: "Limit training rows for fast local CI; empty = full dataset"
        required: false
        default: "50000"
      skip_simulate:
        description: "Skip MoPhong simulation for fast CI"
        required: true
        type: boolean
        default: true
      enable_mlflow:
        description: "Log this CI run to local MLflow sqlite"
        required: true
        type: boolean
        default: false

concurrency:
  group: fs03-optuna-local-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optuna-pipeline:
    name: FS03 LightGBM Optuna pipeline on local Windows runner
    runs-on: self-hosted
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: research;research/rf_mlflow;vendor/scj
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MLFLOW_ARTIFACT_ROOT: mlruns
      OPTUNA_N_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.n_trials || '3' }}
      OPTUNA_MAX_TRAIN_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_train_rows || '50000' }}
      OPTUNA_SKIP_SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_simulate || true }}
      OPTUNA_ENABLE_MLFLOW: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_mlflow || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate local Python 3.11
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $pythonCandidates = @(
            "C:\Program Files\Python311\python.exe",
            "C:\Python311\python.exe",
            "$env:LocalAppData\Programs\Python\Python311\python.exe"
          )

          $pythonExe = $pythonCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $pythonExe) {
            $command = Get-Command python -ErrorAction SilentlyContinue

            if ($command) {
              $pythonExe = $command.Source
            }
          }

          if (-not $pythonExe) {
            throw "Không tìm thấy Python 3.11 trên self-hosted runner. Hãy cài Python 3.11 x64 cho tài khoản chạy GitHub Actions."
          }

          $version = & $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"

          if ($version -ne "3.11") {
            throw "Python không đúng phiên bản 3.11: $version"
          }

          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          "PYTHON_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host "Python executable: $pythonExe"
          & $pythonExe --version
          & $pythonExe -m pip --version
          
      - name: Show runner and Python environment
        shell: powershell
        run: |
          $env:Path = "C:\Users\admin\AppData\Local\Programs\Python\Python311;C:\Users\admin\AppData\Local\Programs\Python\Python311\Scripts;" + $env:Path
          python --version
          Write-Host "=== Operating system ==="
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture


          Write-Host "`n=== Python installations ==="
          py -0p

          Write-Host "`n=== Python 3.11 environment ==="
          py -3.11 --version
          py -3.11 -c "import sys, platform; print('Executable:', sys.executable); print('Prefix:', sys.prefix); print('Base prefix:', sys.base_prefix); print('Platform:', platform.platform()); print('Architecture:', platform.architecture())"
          py -3.11 -m pip --version

          Write-Host "`n=== Runner context ==="
          Get-Location
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Trials: $env:OPTUNA_N_TRIALS"
          Write-Host "Max train rows: $env:OPTUNA_MAX_TRAIN_ROWS"
          Write-Host "Skip simulate: $env:OPTUNA_SKIP_SIMULATE"
          Write-Host "Enable MLflow: $env:OPTUNA_ENABLE_MLFLOW"

      - name: Install dependencies
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      - name: Static syntax check
        shell: powershell
        run: |
          $files = Get-ChildItem -LiteralPath "pipelines/_optuna" -Filter "*.py" |
            ForEach-Object { $_.FullName }

          & $env:PYTHON_EXE -m py_compile @files

      - name: Lint Optuna pipeline
        shell: powershell
        run: |
          python -m ruff check pipelines/_optuna

      - name: CLI smoke tests
        shell: powershell
        run: |
          py -3.11 pipelines/_optuna/data_processing.py --help
          py -3.11 pipelines/_optuna/train_optuna_fs03.py --help
          py -3.11 pipelines/_optuna/evaluate_fs03.py --help
          py -3.11 pipelines/_optuna/run_fs03_optuna_pipeline.py --help

      - name: Build DVC feature store
        shell: powershell
        run: |
          python -m dvc repro fs03_feature_store
          python -m dvc status --no-commit

      - name: Run FS03 Optuna CI pipeline
        shell: powershell
        run: |
          $argsList = @(
            "pipelines/_optuna/run_fs03_optuna_pipeline.py",
            "--n-trials", "$env:OPTUNA_N_TRIALS"
          )

          if ($env:OPTUNA_MAX_TRAIN_ROWS -and $env:OPTUNA_MAX_TRAIN_ROWS.Trim() -ne "") {
            $argsList += @("--max-train-rows", "$env:OPTUNA_MAX_TRAIN_ROWS")
          }

          if ($env:OPTUNA_SKIP_SIMULATE -eq "true" -or $env:OPTUNA_SKIP_SIMULATE -eq "True") {
            $argsList += "--skip-simulate"
          }

          if ($env:OPTUNA_ENABLE_MLFLOW -eq "true" -or $env:OPTUNA_ENABLE_MLFLOW -eq "True") {
            $argsList += "--enable-mlflow"
          }

          py -3.11 @argsList

      - name: Upload Optuna CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs03-optuna-local-windows-${{ github.run_number }}
          path: |
            outputs/pipelines_optuna/**
            models/*fs03_optuna_lgbm*_bundle.joblib
          if-no-files-found: warn
          retention-days: 14
